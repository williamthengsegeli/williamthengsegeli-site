<header class="site-header">
  <nav class="nav-inner" aria-label="Primary navigation">
    <a class="site-name" href="{{ "/" | relURL }}">{{ .Site.Params.name }}</a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-menu" id="nav-menu" role="list">
      <li><a href="#about">About</a></li>
      <li><a href="#research">Research</a></li>
      <li><a href="#teaching">Teaching</a></li>
      <li><a href="#blog">Blog</a></li>
      <li><a href="#contact">Contact</a></li>
      <li><a class="nav-cv" href="{{ .Site.Params.cv | relURL }}">CV</a></li>
    </ul>
  </nav>
</header>
<script>
  const toggle = document.querySelector('.nav-toggle');
  const menu = document.getElementById('nav-menu');
  if (toggle) {
    toggle.addEventListener('click', () => {
      const expanded = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!expanded));
      menu.classList.toggle('open');
    });
  }
</script>
